<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Beelia Customer Display - Default Banner</title>
  <style>
    :root {
      --beelia-orange: #f36b32;
      --beelia-orange-deep: #d94c20;
      --beelia-ink: #292733;
      --beelia-muted: #6f6972;
      --beelia-cream: #fff9f3;
      --beelia-petal: #f8d9cf;
      --beelia-white: #ffffff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--beelia-cream);
    }

    body {
      color: var(--beelia-ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .banner {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(360px, 0.92fr);
      width: 100vw;
      height: 100vh;
      min-height: 480px;
      overflow: hidden;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.96) 0 12%, transparent 33%),
        linear-gradient(125deg, #fffdf9 0%, #fff6ed 58%, #fee8dc 100%);
    }

    .banner::before {
      content: "";
      position: absolute;
      z-index: -1;
      width: 42vw;
      height: 42vw;
      right: -13vw;
      top: -24vw;
      border: 3.2vw solid rgba(243, 107, 50, .08);
      border-radius: 50%;
    }

    .banner::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: 34vw;
      height: 34vw;
      left: -20vw;
      bottom: -25vw;
      border-radius: 50%;
      background: rgba(243, 107, 50, .1);
    }

    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(42px, 6vw, 92px) clamp(42px, 7vw, 104px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      width: fit-content;
      margin-bottom: clamp(38px, 6vh, 68px);
      animation: reveal .8s ease-out both;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      color: var(--beelia-white);
      border-radius: 18px 18px 18px 5px;
      background: linear-gradient(145deg, #ff8954, var(--beelia-orange-deep));
      box-shadow: 0 13px 28px rgba(217, 76, 32, .22);
      transform: rotate(-3deg);
    }

    .brand-mark svg { width: 30px; height: 30px; }

    .brand-name {
      font-size: clamp(28px, 3vw, 42px);
      font-weight: 800;
      letter-spacing: -.055em;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 20px;
      color: var(--beelia-orange-deep);
      font-size: clamp(14px, 1.45vw, 19px);
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
      animation: reveal .8s .12s ease-out both;
    }

    .eyebrow::before {
      content: "";
      width: 38px;
      height: 3px;
      border-radius: 10px;
      background: var(--beelia-orange);
    }

    h1 {
      max-width: 760px;
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(54px, 7vw, 102px);
      font-weight: 500;
      line-height: .95;
      letter-spacing: -.055em;
      animation: reveal .9s .2s ease-out both;
    }

    h1 em {
      color: var(--beelia-orange-deep);
      font-weight: 500;
    }

    .message {
      max-width: 620px;
      margin: 28px 0 0;
      color: var(--beelia-muted);
      font-size: clamp(20px, 2vw, 28px);
      line-height: 1.45;
      animation: reveal .9s .3s ease-out both;
    }

    .footer-note {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: clamp(38px, 7vh, 76px);
      color: #877e82;
      font-size: clamp(13px, 1.2vw, 17px);
      font-weight: 700;
      letter-spacing: .04em;
      animation: reveal .9s .42s ease-out both;
    }

    .footer-note span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--beelia-orange);
      box-shadow: 0 0 0 6px rgba(243, 107, 50, .12);
    }

    .visual {
      position: relative;
      display: grid;
      place-items: center;
      padding: clamp(35px, 5vw, 70px);
    }

    .arch {
      position: relative;
      width: min(100%, 520px);
      aspect-ratio: .76;
      overflow: hidden;
      border: 12px solid rgba(255,255,255,.72);
      border-radius: 260px 260px 34px 34px;
      background:
        linear-gradient(165deg, rgba(255,255,255,.2), transparent 48%),
        linear-gradient(150deg, #facab9, #f18a5e 55%, #d94c20);
      box-shadow: 0 38px 80px rgba(135, 67, 43, .22);
      animation: float-in 1.1s cubic-bezier(.2,.7,.2,1) both;
    }

    .arch::before,
    .arch::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 50%;
    }

    .arch::before { inset: 13% -24% 18% 30%; }
    .arch::after { inset: 34% 38% -18% -34%; }

    .nail-art {
      position: absolute;
      inset: 9% 8% 5%;
      width: 84%;
      height: 86%;
      filter: drop-shadow(0 22px 22px rgba(91, 44, 31, .2));
    }

    .seal {
      position: absolute;
      right: clamp(22px, 4vw, 70px);
      bottom: clamp(28px, 7vh, 78px);
      display: grid;
      place-items: center;
      width: clamp(104px, 12vw, 154px);
      aspect-ratio: 1;
      padding: 15px;
      color: var(--beelia-orange-deep);
      text-align: center;
      border: 2px solid rgba(217, 76, 32, .18);
      border-radius: 50%;
      background: rgba(255,255,255,.92);
      box-shadow: 0 18px 38px rgba(80, 49, 38, .16);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(14px, 1.35vw, 19px);
      font-style: italic;
      line-height: 1.15;
      transform: rotate(-7deg);
      animation: seal-in .7s .65s ease-out both;
    }

    @keyframes reveal {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float-in {
      from { opacity: 0; transform: translate(36px, 20px) scale(.96); }
      to { opacity: 1; transform: translate(0, 0) scale(1); }
    }

    @keyframes seal-in {
      from { opacity: 0; transform: rotate(-7deg) scale(.7); }
      to { opacity: 1; transform: rotate(-7deg) scale(1); }
    }

    @media (max-aspect-ratio: 6/5) {
      .banner { grid-template-columns: 1fr; }
      .content { z-index: 2; justify-content: flex-end; padding-bottom: 9vh; }
      .visual { position: absolute; inset: -10% -28% 10% 38%; opacity: .45; }
      .message { max-width: 70%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="banner" aria-label="Beelia welcome banner">
    <section class="content">
      <div class="brand" aria-label="Beelia">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M7 18.5C7 11.2 11.2 6 16.8 6c4.9 0 8.2 3.1 8.2 7.3 0 5.7-5.1 11.9-14.8 12.7" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
            <path d="M8 11.5c3.9 0 7.1 3.2 7.1 7.1V26" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="brand-name">beelia</div>
      </div>

      <p class="eyebrow">Nail care, beautifully simple</p>
      <h1>Welcome.<br><em>Your moment</em><br>starts here.</h1>
      <p class="message">Sit back, relax, and let our artists take care of the details.</p>

      <div class="footer-note"><span aria-hidden="true"></span>Powered by Beelia Salon Management</div>
    </section>

    <section class="visual" aria-hidden="true">
      <div class="arch">
        <svg class="nail-art" viewBox="0 0 420 560" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M80 500c27-93 50-169 69-234 15-50 29-106 52-156 13-29 39-57 69-47 33 11 35 52 22 83-19 45-41 88-57 134-27 76-44 151-51 220H80Z" fill="#FBE9E0"/>
          <path d="M177 503c16-91 33-166 51-227 14-49 34-112 70-147 21-21 53-29 72-8 21 23 8 57-10 82-31 43-52 83-70 132-21 56-36 113-47 168h-66Z" fill="#FFF7F0"/>
          <path d="M129 501c19-74 39-151 61-226 18-64 37-126 63-181 9-20 31-36 50-25 20 12 16 40 6 59-29 55-49 116-67 177-19 65-34 131-45 196h-68Z" fill="#F8D9CF"/>
          <path d="M251 91c11-18 31-29 48-20 18 10 17 33 9 50l-13 28-57-27 13-31Z" fill="#BE3D24"/>
          <path d="M295 136c20-33 53-46 72-28 17 17 7 44-12 66l-24 30-53-38 17-30Z" fill="#E95E35"/>
          <path d="M199 115c10-29 31-54 55-46 24 9 21 40 11 66l-13 35-64-21 11-34Z" fill="#FF8B62"/>
          <path d="M147 195c7-31 25-61 50-58 26 4 29 36 23 64l-8 39-73-10 8-35Z" fill="#D94C20"/>
          <path d="M103 280c3-32 17-65 43-65 27 0 35 32 32 62l-4 39-75 2 4-38Z" fill="#F3794F"/>
          <path d="M263 82c16 8 27 20 34 35" stroke="#FFD4C4" stroke-width="5" stroke-linecap="round"/>
          <path d="M309 129c17 7 28 18 35 31" stroke="#FFC5B3" stroke-width="5" stroke-linecap="round"/>
          <path d="M208 92c17 4 30 14 39 26" stroke="#FFD8C9" stroke-width="5" stroke-linecap="round"/>
          <path d="M160 169c18 1 33 8 44 19" stroke="#FFB7A0" stroke-width="5" stroke-linecap="round"/>
          <path d="M117 247c18-2 35 3 48 12" stroke="#FFC3AF" stroke-width="5" stroke-linecap="round"/>
          <circle cx="105" cy="99" r="7" fill="#FFF" fill-opacity=".75"/>
          <circle cx="337" cy="300" r="10" fill="#FFF" fill-opacity=".55"/>
          <path d="M78 142c18-3 31-16 35-34 3 18 16 31 34 34-18 4-31 17-34 35-4-18-17-31-35-35Z" fill="#FFF" fill-opacity=".78"/>
          <path d="M320 372c12-2 21-11 23-23 3 12 12 21 24 23-12 3-21 12-24 24-2-12-11-21-23-24Z" fill="#FFF" fill-opacity=".68"/>
        </svg>
      </div>
      <div class="seal">Beautiful service.<br>Memorable care.</div>
    </section>
  </main>
</body>
</html>
